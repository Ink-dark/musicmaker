name: Release

# 推送 v* 标签触发完整发布（构建 → GitHub Release）；
# workflow_dispatch 仅执行多平台构建，用于发版前验证，不创建 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (ubuntu-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 四架构：cross 交叉编译（见 Cross.toml，自动安装目标架构 ALSA 头文件）
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,      name: linux-x86_64 }
          - { os: ubuntu-latest,  target: i686-unknown-linux-gnu,        name: linux-i686 }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf, name: linux-arm32 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,     name: linux-arm64 }
          # Windows 三架构：MSVC，x86 / x64 原生，ARM64 用 runner 自带 cross 工具链
          # （Rust 无 Windows 32 位 ARM 桌面目标，WoA32 设备经 x86 模拟运行 i686 版）
          - { os: windows-latest, target: x86_64-pc-windows-msvc,        name: windows-x86_64 }
          - { os: windows-latest, target: i686-pc-windows-msvc,          name: windows-i686 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,       name: windows-arm64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="mm-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/mm" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "mm-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mm.exe" $dir
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 |
            | --- | --- |
            | Linux x64 | `*-linux-x86_64.tar.gz` |
            | Linux x86（32 位） | `*-linux-i686.tar.gz` |
            | Linux ARM32（armhf 硬浮点） | `*-linux-arm32.tar.gz` |
            | Linux ARM64 | `*-linux-arm64.tar.gz` |
            | Windows x64 | `*-windows-x86_64.zip` |
            | Windows x86（32 位） | `*-windows-i686.zip` |
            | Windows ARM64 | `*-windows-arm64.zip` |

            ## 运行说明

            - Linux 版动态链接 glibc 与 ALSA（`libasound.so.2`，主流发行版自带），`play` 实时播放需要 ALSA 声卡驱动；纯 `render`/`keymap` 无需音频设备。
            - Windows ARM32 设备（Windows on ARM）可下载 x86 版本，由系统模拟运行。
            - SHA256 校验见 `SHA256SUMS.txt`。
